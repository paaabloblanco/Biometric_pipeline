name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + tipos
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # core/settings/base.py exige DJANGO_SECRET_KEY al importar. Valor de
      # usar y tirar: aquí no se levanta ningún servidor ni se toca la BD.
      DJANGO_SECRET_KEY: ci-placeholder-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format
        run: ruff format --check .

      - name: mypy
        run: mypy .

  tests:
    name: tests (BD real)
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: backend
    # Opt-in: crea la variable de repo RUN_DB_TESTS=true y añade los secrets de
    # abajo (Settings -> Secrets and variables -> Actions). Sin eso, este job
    # se salta y CI se queda en lint + tipos.
    if: vars.RUN_DB_TESTS == 'true'
    env:
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: unittest
        run: python -m unittest discover -s . -p "test_*.py" -v
